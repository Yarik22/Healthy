<div class="user-stats-container">
  <div class="loading-spinner" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Завантаження даних...</p>
  </div>

  <div class="error-message" *ngIf="error && !loading">
    <i class="fas fa-exclamation-triangle"></i>
    <p>{{ error }}</p>
    <button (click)="loadStats()">Спробувати знову</button>
  </div>

  <div class="stats-grid" *ngIf="!loading && !error && stats.length">
    <div class="stat-card" *ngFor="let stat of stats">
      <div
        class="stat-header"
        [style.background]="getStateColor(stat.mentalState)"
      >
        <h3>{{ getTranslatedState(stat.mentalState) }}</h3>
        <span class="stat-value">{{ stat.value }}/100</span>
      </div>

      <div class="progress-container">
        <div
          class="progress-bar"
          [style.width.%]="stat.value"
          [style.background]="getStateColor(stat.mentalState)"
        ></div>
      </div>
    </div>
  </div>

  <div class="no-stats" *ngIf="!loading && !error && !stats.length">
    <i class="fas fa-chart-pie"></i>
    <p>Немає даних для відображення</p>
  </div>
</div>
