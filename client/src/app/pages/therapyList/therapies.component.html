<div class="therapy-page">
  <header class="therapy-header">
    <h1>Методи Терапії</h1>
    <p class="subtitle">
      Досліджуйте терапевтичні методи, які можуть допомогти вам відчути себе
      краще.
    </p>

    <div class="filter-controls">
      <div class="search-box">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="filterTherapies()"
          placeholder="Пошук терапії..."
          class="search-input"
        />
        <span class="search-icon">🔍</span>
      </div>

      <select
        [(ngModel)]="selectedMentalState"
        (change)="filterTherapies()"
        class="mental-state-filter"
      >
        <option [ngValue]="null">Фільтр за емоційним станом</option>
        <option *ngFor="let state of allMentalStates" [ngValue]="state">
          {{ getTranslatedMentalState(state) }}
        </option>
      </select>
    </div>
  </header>

  <app-loader *ngIf="isLoading"></app-loader>

  <div *ngIf="error" class="error-state">
    <p class="error-message">
      Щось пішло не так під час завантаження методів терапії.
    </p>
    <button (click)="loadTherapies()" class="retry-button">
      Повторити спробу
    </button>
  </div>

  <div class="therapy-list" *ngIf="!isLoading && !error">
    <ng-container *ngIf="filteredTherapies.length > 0; else noResults">
      <app-therapy-badge
        *ngFor="let therapy of filteredTherapies; trackBy: trackByTherapy"
        [title]="therapy.title"
        [description]="therapy.description ?? 'Опис відсутній'"
        [img]="therapy.img ?? './assets/default-therapy.jpg'"
        [mentalStates]="therapy.mentalStates"
      ></app-therapy-badge>
    </ng-container>

    <ng-template #noResults>
      <div class="no-results">
        <h2>Ой!</h2>
        <h3>Методи терапії не знайдені</h3>
        <p>Спробуйте змінити фільтри або введіть інші ключові слова.</p>
      </div>
    </ng-template>
  </div>
</div>
