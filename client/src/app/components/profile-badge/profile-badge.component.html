<div class="profile-badge">
  <div class="profile-content">
    <div class="avatar-container">
      <div class="avatar-ring">
        <img
          *ngIf="userImageBase64; else defaultAvatar"
          [src]="userImageBase64"
          alt="Profile picture"
          class="avatar"
        />
        <ng-template #defaultAvatar>
          <div class="avatar default-avatar">
            {{ getInitials() }}
          </div>
        </ng-template>
      </div>
    </div>

    <div class="profile-info">
      <h2>{{ user.nickname }}</h2>
      <p class="email">{{ user.email }}</p>

      <div class="stats-container" *ngIf="age || user.sex">
        <div class="stat-pill" *ngIf="age">
          <span class="stat-value">{{ age }}</span>
          <span class="stat-label">years</span>
        </div>
        <div class="stat-pill" *ngIf="user.sex">
          <span class="stat-value">{{ getSexDisplayText() }}</span>
        </div>
      </div>
    </div>

    <div class="profile-details" *ngIf="user.bio">
      <div class="bio-container">
        <svg class="quote-icon" viewBox="0 0 24 24">
          <path
            d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"
          />
        </svg>
        <p class="bio">{{ user.bio }}</p>
      </div>
    </div>
  </div>
</div>
